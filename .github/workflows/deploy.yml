name: SportGo Backend CI/CD Pipeline

# 1. Kích hoạt quy trình khi có hành động PUSH vào nhánh main
on:
  push:
    branches: [ "main" ]

jobs:
  # VẾ 1: CHẠY CI (KIỂM TRA ĐỘC LẬP TRÊN MÁY ẢO CỦA GITHUB)
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn từ GitHub
      uses: actions/checkout@v4

    - name: Thiết lập môi trường PHP 8.5
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, ctype, iconv, mysql, redis

    - name: Sao chép tệp cấu hình môi trường Test
      run: cp .env.example .env

    - name: Cài đặt các thư viện Composer
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Khởi tạo Key mã hóa của Laravel
      run: php artisan key:generate

    - name: Chạy các bài Automated Testing (Unit Test)
      run: php artisan test --v

  # VẾ 2: CHẠY CD (KẾT NỐI VÀ DEPLOY SANG AWS EC2)
  continuous-deployment:
    runs-on: ubuntu-latest
    needs: continuous-integration # Bắt buộc vòng loại CI phải CHẠY XANH thì mới được DEPLOY

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thực thi lệnh cập nhật tự động trên AWS EC2 thông qua SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /var/www/sportGo_BE
          
          echo "📥 1. Đang tự động kéo code mới nhất từ GitHub..."
          sudo git pull origin main
          
          echo "📦 2. Cập nhật các gói thư viện Composer..."
          sudo composer install --no-dev --optimize-autoloader
          
          echo "🗄️ 3. Tự động đồng bộ Database (Migrations)..."
          sudo -u www-data php artisan migrate --force
          
          echo "🧹 4. Dọn dẹp và làm sạch bộ nhớ đệm (Cache)..."
          sudo -u www-data php artisan config:clear
          sudo -u www-data php artisan route:clear
          
          echo "🔄 5. Khởi động lại dịch vụ PHP-FPM để nạp code sạch..."
          sudo systemctl restart php8.5-fpm
          
          echo "✨ [THÀNH CÔNG] Toàn bộ hệ thống SportGo bản mới nhất đã online!"